{% extends 'catalog/base.html' %}
{% block container %}
<div class="container">
    <form class="row" method="post" enctype="multipart/form-data">
        <div class="col">
            <div class="card">
                <div class="card-body">
                    {% csrf_token %}
                    {{ form.non_field_errors }}
                    {{ form.as_p }}
                </div>
                <button type="submit" class="btn btn-primary mt-3">
                    {% if product.id %}
                    Сохранить
                    {% else %}
                    Создать
                    {% endif %}
                </button>
                <button class="btn btn-primary mt-3">
                    <a class="btn btn-primary" href="{% url 'catalog:base' %}" role="button">Назад</a>
                </button>
            </div>
        </div>
    </form>
</div>

{% endblock %}
