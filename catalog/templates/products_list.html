{% extends 'base.html' %}
{% load my_tags %}
{% block container %}
<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
                    {% for product in products %}
                    <div class="col">
                        <div class="card shadow-sm">
                            <div class="text-center">
                                <img src="{{ product.photo | media_filter }}" class="img-fluid" style="max-height: 300px; margin: auto;">
                            </div>
                            <div class="card-body">
                                <p class="card-text"> {{ product.name | truncatechars:100 }}</p>
                                <div class="d-flex justify-content-between align-items-center">
                                    <div class="btn-group">
                                        <a class="btn btn-primary" href="{% url 'catalog:product_details' product.pk %}" role="button">Детальная информация</a>
                                        <a class="btn btn-primary" href="#" role="button">Добавить в корзину</a>
                                    </div> <small class="text-body-secondary"></small> </div>
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                </div>
{% endblock %}
