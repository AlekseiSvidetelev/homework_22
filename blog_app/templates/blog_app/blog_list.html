{% extends 'blog_app/blog.html' %}
{% load my_tags %}
{% block container %}
<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
{% for blog in object_list %}
    {% if blog.is_published %}
        <div class="col">
            <div class="card shadow-sm">
                <div class="text-center">
                    <img src="{{ blog.preview | media_filter }}" class="img-fluid" style="max-height: 300px; margin: auto;">
                </div>
                <div class="card-body">
                    <p class="card-text"> {{ blog.title | truncatechars:100 }}</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="btn-group">
                            <a class="btn btn-primary" href="{% url 'blog_app:post_details' blog.pk %}" role="button">Детальная информация</a>
                        </div> <small class="text-body-secondary"></small> </div>
                </div>
            </div>
        </div>
    {% endif %}
{% endfor %}
</div>
{% endblock %}
